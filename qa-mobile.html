<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex,nofollow" />
<title>QA — WORLD LIVE 폭별 상단 바 점검</title>
<style>
  body { margin: 0; background: #11161f; color: #cbd6e4; font: 13px/1.4 system-ui, sans-serif; }
  .row { display: flex; gap: 12px; padding: 10px; align-items: flex-start; flex-wrap: wrap; }
  .cell { border: 1px solid #2b3a52; border-radius: 10px; overflow: hidden; background: #0b1220; }
  .cap { padding: 5px 9px; font-weight: 700; color: #ffd978; }
  iframe { display: block; border: 0; background: #000; }
</style>
</head>
<body>
<div class="row">
  <div class="cell"><div class="cap">360 × 720</div><iframe id="f360" src="./?v=pwa1" width="360" height="720"></iframe></div>
  <div class="cell"><div class="cap">412 × 720</div><iframe id="f412" src="./?v=pwa1" width="412" height="720"></iframe></div>
  <div class="cell"><div class="cap">1280 × 720</div><iframe id="f1280" src="./?v=pwa1" width="1280" height="720"></iframe></div>
</div>
<div class="row">
  <div class="cell"><div class="cap">1366 × 720</div><iframe id="f1366" src="./?v=pwa1" width="1366" height="720"></iframe></div>
  <div class="cell"><div class="cap">1600 × 720</div><iframe id="f1600" src="./?v=pwa1" width="1600" height="720"></iframe></div>
</div>
<script>
  // 설치 버튼은 iframe 안에서 beforeinstallprompt 가 오지 않으므로, 레이아웃 점검용으로 강제로 켠다.
  const force = new URLSearchParams(location.search).has('force');
  function once(id) {
    const f = document.getElementById(id);
    f.addEventListener('load', () => {
      if (!force) return;
      try {
        const d = f.contentDocument;
        const b = d.getElementById('btn-install');
        if (b) { b.hidden = false; d.body.classList.add('has-install-btn'); }
      } catch (e) {}
    });
  }
  ['f360','f412','f1280','f1366','f1600'].forEach(once);
</script>
</body>
</html>
