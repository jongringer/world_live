<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>globe preview</title>
<style>
body{margin:0;background:linear-gradient(180deg,#2B3B59,#182235);color:#cbd5e1;font-family:sans-serif;display:flex;align-items:center;gap:30px;padding:20px}
.box{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px}
.huge svg{width:620px;height:620px;display:block}
.big svg{width:220px;height:220px;display:block}
.mid svg{width:96px;height:96px;display:block}
.small svg{width:42px;height:42px;display:block}
.col{display:flex;flex-direction:column;gap:16px;align-items:center}
</style></head><body>
<div class="box huge">620</div>
<div class="col"><div class="box big">220</div><div class="box mid">96</div><div class="box small">42</div><div class="box small">42</div></div>
<div id="src" hidden>
      <svg class="brand-mark globe-mark" viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <!-- 바다: 표층 하이라이트 → 심해 -->
          <radialGradient id="gOcean" cx="30%" cy="23%" r="88%">
            <stop offset="0%" stop-color="#9BE7F7"/>
            <stop offset="16%" stop-color="#57BCD8"/>
            <stop offset="40%" stop-color="#2181A3"/>
            <stop offset="66%" stop-color="#0C4560"/>
            <stop offset="86%" stop-color="#062A3D"/>
            <stop offset="100%" stop-color="#03131E"/>
          </radialGradient>
          <!-- 대륙: 금빛 지형 -->
          <linearGradient id="gLand" x1="18%" y1="0%" x2="88%" y2="100%">
            <stop offset="0%" stop-color="#F8EBC8"/>
            <stop offset="34%" stop-color="#E2C58C"/>
            <stop offset="70%" stop-color="#B08C51"/>
            <stop offset="100%" stop-color="#6E5430"/>
          </linearGradient>
          <!-- 구체 명암: 오른쪽·아래로 갈수록 어두워짐 -->
          <radialGradient id="gShade" cx="27%" cy="21%" r="94%">
            <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
            <stop offset="48%" stop-color="rgba(3,10,18,.04)"/>
            <stop offset="76%" stop-color="rgba(3,9,16,.44)"/>
            <stop offset="92%" stop-color="rgba(2,7,13,.80)"/>
            <stop offset="100%" stop-color="rgba(1,4,9,.94)"/>
          </radialGradient>
          <!-- 대기권 링 -->
          <radialGradient id="gAtmo" cx="50%" cy="50%" r="50%">
            <stop offset="74%" stop-color="rgba(90,215,245,0)"/>
            <stop offset="90%" stop-color="rgba(120,228,252,.20)"/>
            <stop offset="98%" stop-color="rgba(170,246,255,.10)"/>
            <stop offset="100%" stop-color="rgba(170,246,255,0)"/>
          </radialGradient>
          <!-- 림 라이트 -->
          <linearGradient id="gRim" x1="10%" y1="4%" x2="90%" y2="96%">
            <stop offset="0%" stop-color="rgba(214,252,255,.95)"/>
            <stop offset="36%" stop-color="rgba(126,226,248,.55)"/>
            <stop offset="70%" stop-color="rgba(70,150,190,.18)"/>
            <stop offset="100%" stop-color="rgba(170,238,255,.60)"/>
          </linearGradient>
          <!-- 스페큘러 하이라이트 -->
          <radialGradient id="gSpec" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="rgba(255,255,255,.66)"/>
            <stop offset="55%" stop-color="rgba(210,248,255,.20)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
          </radialGradient>
          <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="rgba(120,235,255,0)"/>
            <stop offset="45%" stop-color="rgba(180,247,255,.95)"/>
            <stop offset="100%" stop-color="rgba(120,235,255,.12)"/>
          </linearGradient>
          <radialGradient id="satHalo" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="rgba(205,250,255,.85)"/>
            <stop offset="55%" stop-color="rgba(110,225,250,.34)"/>
            <stop offset="100%" stop-color="rgba(110,225,250,0)"/>
          </radialGradient>
          <clipPath id="gClip"><circle cx="23" cy="24" r="15.5"/></clipPath>
          <filter id="gSoft" x="-70%" y="-70%" width="240%" height="240%">
            <feGaussianBlur stdDeviation="1.5"/>
          </filter>
          <path id="orbitPath" d="M44 24a21 8.2 0 1 0-42 0a21 8.2 0 1 0 42 0z"/>
          <!-- 대륙 세트 (회전용으로 두 번 배치) -->
          <g id="landSet" fill="url(#gLand)" stroke="rgba(74,52,22,.42)" stroke-width=".28" stroke-linejoin="round">
            <path d="M12.3 14.9c1-1.5 2.6-2.1 4-1.4 1 .5 2.1.5 3-.1 1.4-.9 3.1-.4 3.8 1.1.6 1.2.1 2.5-1.1 3-.9.4-1.5 1.3-1.3 2.3.2 1.1-.5 2-1.6 2.2-1.2.2-2-.6-2.9-1-1-.4-2.3 0-3-.9-.6-.8-.2-1.9-.8-2.7-.7-1-.7-2.2-.1-2.5z"/>
            <path d="M22.2 21.4c1.6-.5 3 .5 3.2 2 .2 1.5-.7 2.7-1.7 3.6-.9.8-1.2 1.9-2.4 2.1-1.3.2-2.4-.9-2.3-2.2 0-1.4.6-2.6 1.5-3.6.6-.7 1.1-1.6 1.7-1.9z"/>
            <path d="M14.1 26.9c1.1-.6 2.4-.2 2.9.8.5 1 0 2.2-.9 2.7-.8.5-1 1.4-1.9 1.6-1.1.2-2.1-.5-2.2-1.5-.1-1.1.5-2 1.3-2.7.3-.3.5-.6.8-.9z"/>
            <path d="M27.5 29c1.1-.4 2.2.2 2.4 1.3.2 1.1-.6 2-1.6 2.2-1 .2-1.9-.4-2-1.4-.1-1 .5-1.8 1.2-2.1z"/>
            <path d="M29.2 17.8c1-.5 2.1-.2 2.4.7.3.9-.3 1.8-1.2 2-.9.2-1.7-.3-1.9-1.1-.2-.7.2-1.3.7-1.6z"/>
          </g>
        </defs>

        <!-- 대기권 헤일로 -->
        <circle cx="23" cy="24" r="17.3" fill="none" stroke="rgba(120,226,250,.13)" stroke-width="2.2" filter="url(#gSoft)"/>
        <circle cx="23" cy="24" r="17.4" fill="url(#gAtmo)"/>

        <!-- 구체 본체 -->
        <circle cx="23" cy="24" r="15.5" fill="url(#gOcean)"/>

        <!-- 극지 빙하 · 대륙 (자전) -->
        <g clip-path="url(#gClip)">
          <ellipse cx="23" cy="10.1" rx="6.6" ry="2.3" fill="rgba(240,252,255,.26)"/>
          <ellipse cx="23" cy="37.8" rx="5.6" ry="2" fill="rgba(240,252,255,.20)"/>
          <g class="globe-land">
            <use href="#landSet"/>
            <use href="#landSet" transform="translate(-31 0)"/>
          </g>
        </g>

        <!-- 경선·위선 그리드 -->
        <g class="globe-grid" clip-path="url(#gClip)" fill="none" stroke="rgba(158,236,252,.30)" stroke-width=".4">
          <ellipse cx="23" cy="24" rx="4" ry="15.5"/>
          <ellipse cx="23" cy="24" rx="8.6" ry="15.5"/>
          <ellipse cx="23" cy="24" rx="12.6" ry="15.5"/>
          <path d="M7.5 24h31" opacity=".75"/>
          <ellipse cx="23" cy="17.2" rx="13.9" ry="1.9" opacity=".85"/>
          <ellipse cx="23" cy="24" rx="15.5" ry="2.6"/>
          <ellipse cx="23" cy="30.8" rx="13.9" ry="1.9" opacity=".85"/>
        </g>

        <!-- 입체 명암 · 하이라이트 · 림 -->
        <circle cx="23" cy="24" r="15.5" fill="url(#gShade)"/>
        <ellipse cx="17.3" cy="17.4" rx="6.6" ry="4.4" fill="url(#gSpec)" transform="rotate(-26 17.3 17.4)" opacity=".75"/>
        <circle class="globe-rim-pulse" cx="23" cy="24" r="15.35" fill="none" stroke="url(#gRim)" stroke-width="1"/>

        <!-- 기울어진 3D 궤도 · 위성 · 신호 빔 -->
        <g transform="rotate(-18 23 24)">
          <use href="#orbitPath" class="orbit-line" fill="none" stroke="rgba(228,203,150,.52)" stroke-width=".62" stroke-dasharray="2.2 2.8"/>
          <path class="beam b-up" d="M37.8 19.4L41.3 20" stroke="url(#beamGrad)" stroke-width=".9" stroke-linecap="round" fill="none"/>
          <path class="beam b-down" d="M38 27.9L41.6 27.7" stroke="url(#beamGrad)" stroke-width=".9" stroke-linecap="round" fill="none"/>
          <g class="sat">
            <circle class="sat-halo" r="3.2" fill="url(#satHalo)"/>
            <rect x="-1.5" y="-.85" width="3" height="1.7" rx=".35" fill="#FFF0CB"/>
            <rect x="-2.95" y="-.5" width="1.25" height="1" fill="rgba(201,168,106,.95)"/>
            <rect x="1.7" y="-.5" width="1.25" height="1" fill="rgba(201,168,106,.95)"/>
            <animateMotion dur="11s" repeatCount="indefinite" rotate="auto">
              <mpath href="#orbitPath"/>
            </animateMotion>
          </g>
        </g>
      </svg>
</div>
<script>
const src = document.getElementById('src').innerHTML;
document.querySelectorAll('.box').forEach(b => b.insertAdjacentHTML('beforeend', src));
</script>
</body></html>
