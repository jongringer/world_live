name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify APK Binary
        run: |
          test -f apk/world-live.apk || { echo "APK file missing"; exit 1; }
          ls -la apk/world-live.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: world-live-app
          path: apk/world-live.apk

      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk/world-live.apk
          name: WORLD LIVE ${{ github.ref_name }}
          body: |
            ### 📱 WORLD LIVE Android 모바일 앱 (${{ github.ref_name }})
            
            - 📲 **모바일 9:16 화면비 최적화**: 4분할(2×2) 단위 매끄러운 세로 스크롤 & 핀치 아웃/더블 탭 시 16:9 가로 풀화면 회전 확대
            - 🌍 **와이드 궤도 3D 지구본 & 반사광 인공위성**
            - 🎛️ **딥 옵시디언 주조정실 테마 & 화이트 탤리 윤곽선**
            - ⚡ **자동 회전 및 화면 꺼짐 방지 내장**
            - 📥 **스마트폰 QR 코드 즉시 다운로드 지원**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
