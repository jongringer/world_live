name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm ci || npm install
          mkdir -p www
          cp -r index.html css js www/
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: world-live-app
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: WORLD LIVE ${{ github.ref_name }}
          body: |
            ### 🚀 WORLD LIVE // GLOBAL NEWSROOM MONITOR (${{ github.ref_name }})
            
            - 🌍 **3D 지구본 & 우주 궤도 인공위성 리뉴얼**: 와이드 궤도, 대형 솔라 패널 날개, 스페큘러 빛 반사(Glint) 및 통신 전파 펄스
            - 🎛️ **딥 옵시디언 주조정실(MCR) 테마**: 초정밀 1px 림 라이트, 블룸버그/스튜디오 스타일 택타일 키
            - 🔊 **Active Audio Tally**: 소스 선택 시 선명한 3px 화이트 림 테두리 및 앰비언트 글로우
            - 📱 **Android APK**: 방송 모니터링 전용 Android 앱 (가로모드 고정, 화면 꺼짐 방지)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
