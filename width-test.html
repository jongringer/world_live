<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>width test</title>
<style>
body{margin:0;background:#05070a;font:12px/1.4 sans-serif;color:#cbd5e1}
.row{padding:6px 8px}
.lbl{font-size:11px;color:#8fa7c0;margin-bottom:3px;font-family:monospace}
iframe{border:1px solid #2a3346;display:block;background:#000}
</style></head><body>
<div class="row"><div class="lbl">1920</div><iframe id="f1920" src="./index.html?v=21&amp;layout=1" width="1900" height="92"></iframe></div>
<div class="row"><div class="lbl">1440</div><iframe id="f1440" src="./index.html?v=21&amp;layout=1" width="1440" height="92"></iframe></div>
<div class="row"><div class="lbl">1366</div><iframe id="f1366" src="./index.html?v=21&amp;layout=1" width="1366" height="92"></iframe></div>
<div class="row"><div class="lbl">1280</div><iframe id="f1280" src="./index.html?v=21&amp;layout=1" width="1280" height="92"></iframe></div>
<script>
window.report = () => [...document.querySelectorAll('iframe')].map(f => {
  const d = f.contentDocument;
  if (!d) return {id:f.id, err:'no doc'};
  const tb = d.querySelector('.topbar');
  if (!tb) return {id:f.id, err:'no topbar'};
  const tbr = tb.getBoundingClientRect();
  const clocks = [...d.querySelectorAll('.clock')].map(c => {
    const r = c.getBoundingClientRect();
    const t = c.querySelector('.clock-t').getBoundingClientRect();
    return {w: Math.round(r.width), inside: r.right <= Math.round(tbr.width), tw: Math.round(t.width), label: c.querySelector('.clock-name').textContent};
  });
  const act = d.querySelector('.actions').getBoundingClientRect();
  return {id:f.id, vw: d.documentElement.clientWidth, overflow: tb.scrollWidth - tb.clientWidth,
          clocksShown: clocks.length, clocks, actionsEnd: Math.round(act.right), fit: Math.round(act.right) <= Math.round(tbr.width)};
});
</script>
</body></html>
