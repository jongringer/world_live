<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>WORLD LIVE — 경제뉴스 뷰포트 검증용(임시)</title>
<style>
  html,body{margin:0;padding:0;background:#000;}
  .row{display:flex;gap:10px;align-items:flex-start;padding:6px;}
  iframe{border:0;display:block;background:#000;}
  #pc,#pcday{width:1440px;height:900px;}
  #mo{width:390px;height:844px;}
</style>
</head>
<body>
<!-- 임시 검증 페이지: 운영 화면을 PC(1440×900) / 스마트폰(390×844) 뷰포트로 띄워 실측하기 위한 파일.
     ?only=pc | pcday | mo 로 하나만 띄웁니다(동시에 여러 개를 띄우면 유튜브 iframe이 화면을 못 그리는 경우가 있음).
     경제뉴스 기본은 야간(21:00~06:30)이면 오선의 미증시, 주간이면 서울경제TV — pcday는 ?night=0 로 주간 모습을 강제합니다.
     검증 후 삭제합니다. -->
<div class="row" id="row"></div>
<script>
  const only = new URLSearchParams(location.search).get('only') || 'pc';
  const row = document.getElementById('row');
  const base = './?layout=econ&probe=';
  const add = (id, src) => {
    const f = document.createElement('iframe');
    f.id = id; f.title = id;
    f.src = src;
    row.appendChild(f);
  };
  if (only === 'pc') add('pc', base + 'pc');
  if (only === 'pcday') add('pcday', base + 'pcday&night=0');
  if (only === 'mo') add('mo', base + 'mo');
</script>
</body>
</html>
